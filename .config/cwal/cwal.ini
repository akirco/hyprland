[general]
out_dir = /home/neil/.cache/cwal
backend = cwal
script_path =

[options]
alpha = 1.00
saturation = 0.00
contrast = 1.00
mode = dark
cols16_mode = darken
skip_cursor = false

[random]
random_dir =

[links]
colors-cava = ~/.config/cava/themes/colors-cava | pkill -USR2 cava
colors-btop.theme = ~/.config/btop/themes/cwal.theme | pkill -USR2  btop
colors-waybar.css = | perl -i -pe 'if (/@define-color color\d+\s+(#[0-9a-fA-F]{6})\s*;/) { $hex=$1; $r=hex(substr($hex,1,2)); $g=hex(substr($hex,3,2)); $b=hex(substr($hex,5,2)); s/\Q$hex\E/rgba($r, $g, $b, 0.8)/; }' ~/.cache/cwal/colors-waybar.css
mako = | sed -i 's/^background-color=\(#[0-9a-fA-F]\{6\}\)$/background-color=\180/' ~/.cache/cwal/colors-mako && makoctl reload
