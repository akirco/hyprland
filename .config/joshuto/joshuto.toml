numbered_command = false
use_trash = true
watch_files = true
xdg_open = true
xdg_open_fork = true

[display]
# default, hsplit
mode = "default"
automatically_count_files = false
collapse_preview = true
# ratios for parent view (optional), current view and preview
column_ratio = [2, 3, 5]
scroll_offset = 2
show_borders = false
show_hidden = true
show_icons = true
tilde_in_titlebar = true
# none, absolute, relative
line_number_style = "absolute"

[display.sort]
# lexical, mtime, natural
method = "natural"
case_sensitive = false
directories_first = true
reverse = false

[preview]
preview_protocol = "auto"
xdg_thumb_size = "xlarge"
max_preview_size = 1073741824  # 1 GiB
preview_script = "~/.config/joshuto/preview_file.sh"
# preview_shown_hook_script = "~/.config/joshuto/on_preview_shown.sh"
# preview_removed_hook_script = "~/.config/joshuto/on_preview_removed.sh"

[search]
# insensitive, sensitive, smart
string_case_sensitivity = "insensitive"
# see above
glob_case_sensitivity = "sensitive"
# see above
regex_case_sensitivity = "sensitive"
# see above
fzf_case_sensitivity = "insensitive"

[tab]
# inherit, home, root
home_page = "home"
