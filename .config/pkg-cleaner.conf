# 包清理工具配置文件
# 自动备份清理前的状态
BACKUP_BEFORE_CLEAN="true"

# 保留多少天内的缓存（单位：天）
KEEP_CACHE_DAYS="7"

# 自动移除孤立包（true/false）
AUTO_REMOVE_ORPHANS="false"

# 显示详细信息（true/false）
SHOW_DETAILED_INFO="true"

# 最大扫描深度
MAX_SCAN_DEPTH="3"

# 跳过扫描的目录
SKIP_DIRS="/home /var/lib /opt"

# 日志级别：DEBUG, INFO, WARN, ERROR
LOG_LEVEL="INFO"
